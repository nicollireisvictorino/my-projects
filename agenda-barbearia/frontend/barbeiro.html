<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda do dia · Barbearia do Bairro</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#15120f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23d08b43'/><text x='16' y='22' font-size='16' text-anchor='middle' font-family='Georgia' fill='%2315120f'>B</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pagina">
    <header class="topo">
      <p class="selo">Área do barbeiro</p>
      <h1>Agenda do dia</h1>
    </header>

    <form id="entrar" class="formulario" hidden>
      <label>Senha
        <input name="senha" type="password" autocomplete="current-password" required>
      </label>
      <p class="erro" id="erro-senha" role="alert" hidden></p>
      <button class="botao" type="submit">Entrar</button>
    </form>

    <section id="painel" hidden>
      <div class="barra-dia">
        <button class="botao contorno pequeno" id="dia-anterior" aria-label="Dia anterior">‹</button>
        <input type="date" id="data" aria-label="Dia">
        <button class="botao contorno pequeno" id="dia-seguinte" aria-label="Próximo dia">›</button>
        <button class="botao contorno pequeno" id="hoje">Hoje</button>
      </div>

      <div class="totais">
        <div class="total"><small>Clientes</small><strong id="total-clientes">0</strong></div>
        <div class="total"><small>Previsto</small><strong id="total-valor">R$ 0,00</strong></div>
      </div>

      <p class="dica" id="vazio" hidden>Nenhum horário marcado nesse dia.</p>
      <ul class="agenda" id="agenda"></ul>
      <p class="erro" id="erro-agenda" role="alert" hidden></p>

      <p class="rodape"><button class="botao contorno pequeno" id="sair">Sair</button></p>
    </section>

    <p class="rodape"><a href="./">Voltar para o agendamento</a></p>
  </div>

  <script src="config.js"></script>
  <script src="comum.js"></script>
  <script src="barbeiro.js"></script>
</body>
</html>
